spring.application.name=demo

spring.datasource.url=jdbc:h2:file:./data/routeguard;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

routeguard.warning-distance-meters=100
routeguard.critical-distance-meters=300
routeguard.gps-stale-seconds=180
routeguard.alert-cooldown-seconds=300
routeguard.gps-update-interval-ms=3000
